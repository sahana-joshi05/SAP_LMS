spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:svlms_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  frontend-base-url: http://localhost:5173
  jwt:
    secret: test_only_secret_key_not_used_anywhere_real_minimum_32_chars
    expiration-ms: 3600000
  login-rate-limit:
    max-attempts: 5
    window-minutes: 15

cors:
  allowed-origin: http://localhost:5173
