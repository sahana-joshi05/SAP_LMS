distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar

# NOTE: this properties file alone isn't enough to run without Maven installed —
# it also needs the mvnw / mvnw.cmd wrapper scripts, which I did not hand-write here
# because getting the real Apache Maven Wrapper script byte-for-word correct without
# being able to test it risked shipping something that silently fails.
#
# If you want the wrapper, run this once with Maven installed and it will generate
# mvnw, mvnw.cmd, and this properties file correctly for you:
#
#   mvn -N wrapper:wrapper
#
# Otherwise, just install Maven (https://maven.apache.org/install.html) and use
# `mvn spring-boot:run` directly, or open the project in IntelliJ/Eclipse, which
# bundle their own Maven support and don't need mvnw at all.
