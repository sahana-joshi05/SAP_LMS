spring.flyway.enabled=false

spring.datasource.url=jdbc:h2:mem:svlms_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

app.frontend-base-url=http://localhost:5173
app.jwt.secret=test_only_secret_key_not_used_anywhere_real_minimum_32_chars
app.jwt.expiration-ms=3600000
app.login-rate-limit.max-attempts=5
app.login-rate-limit.window-minutes=15
app.email.smtp.enabled=false

cors.allowed-origin=http://localhost:5173
