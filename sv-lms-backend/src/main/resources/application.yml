server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/svlms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway (see db/migration/) now owns schema changes. 'validate' means Hibernate
      # checks its entity mappings match the real schema and fails loudly if they don't,
      # rather than silently altering tables. Override with DDL_AUTO=update only for
      # rapid local prototyping before you've written a migration for a change.
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  jwt:
    # Falls back to an insecure dev-only value if JWT_SECRET isn't set - SecurityStartupCheck
    # logs a loud warning on boot if this default is still in use, so it can't go unnoticed.
    secret: ${JWT_SECRET:dev_only_insecure_default_change_before_prod_min_32_chars}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}   # 12 hours
  login-rate-limit:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window-minutes: ${LOGIN_WINDOW_MINUTES:15}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
