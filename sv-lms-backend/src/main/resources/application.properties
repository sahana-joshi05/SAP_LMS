server.port=${PORT:${SERVER_PORT:8080}}
spring.profiles.default=${SPRING_PROFILES_DEFAULT:local}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:svlms}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes. validate makes Hibernate check mappings against the real schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:dev_only_insecure_default_change_before_prod_min_32_chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
app.login-rate-limit.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login-rate-limit.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.email.smtp.enabled=${MAIL_ENABLED:false}
app.email.fail-user-create-on-send-error=${MAIL_FAIL_USER_CREATE_ON_SEND_ERROR:${MAIL_ENABLED:false}}
app.mail.from=${MAIL_FROM:svcuriotech@gmail.com}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:svcuriotech@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
