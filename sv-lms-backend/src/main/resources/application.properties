server.port=${PORT:${SERVER_PORT:8080}}
spring.profiles.default=${SPRING_PROFILES_DEFAULT:local}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:svlms}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes. validate makes Hibernate check mappings against the real schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:dev_only_insecure_default_change_before_prod_min_32_chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
app.login-rate-limit.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login-rate-limit.window-minutes=${LOGIN_WINDOW_MINUTES:15}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
