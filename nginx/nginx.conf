worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # IP-based rate limit for login attempts, complementing the per-email limit
    # enforced inside the backend (see LoginRateLimiter.java). This stops one IP from
    # hammering many different email addresses, which the in-app limiter alone can't.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
