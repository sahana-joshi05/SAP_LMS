# Reverse proxy for a production deployment of SV LMS.
# Not required for local development (use `npm run dev` + `mvn spring-boot:run` instead).
#
# This assumes:
#   - the React app has been built (`npm run build` in sv-lms-frontend) and its `dist/`
#     folder is served as static files, e.g. copied to /usr/share/nginx/html
#   - the Spring Boot backend is running and reachable at backend:8080 (adjust if you
#     containerize it under a different service name / host)

server {
    listen 80;
    server_name _;

    # Serve the built React app
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login gets a stricter, dedicated rate limit before falling through to the
    # general API proxy below - burst=3 allows a little slack for real users retyping
    # a mistyped password, nodelay rejects anything beyond that immediately (429)
    # rather than queuing it.
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8080/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls to the Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
